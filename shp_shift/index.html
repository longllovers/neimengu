<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SHP 整体偏移工具</title>
  <style>
    :root{color-scheme:light;--ink:#0b1b34;--muted:#60708a;--page:#f3f6f9;--card:#fff;--line:#d6dee8;--blue:#285ea8;--blue2:#1f4d8d;--pale:#eef4fb;--red:#b23b47}
    *{box-sizing:border-box}body{margin:0;font-family:system-ui,"Microsoft YaHei",sans-serif;color:var(--ink);background:var(--page);min-height:100vh}
    header{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 max(28px,calc((100vw - 1440px)/2));gap:16px}header .mark{width:34px;height:34px;border-radius:9px;background:#102846;color:#fff;display:grid;place-items:center;font-weight:800}header strong{font-size:20px}header span{color:var(--muted);font-size:14px}
    main{max-width:1440px;margin:0 auto;padding:28px;display:grid;grid-template-columns:minmax(530px,1.05fr) minmax(500px,.95fr);gap:26px;align-items:start}
    .card{background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:0 2px 5px #17345c0a;overflow:hidden;margin-bottom:24px}.card-body{padding:28px 30px}.card-title{padding:21px 28px;border-bottom:1px solid var(--line);font-size:19px;font-weight:750}
    h2{font-size:20px;margin:0 0 20px;padding-top:25px;border-top:1px solid #e3e8ef}h2:first-child{padding-top:0;border-top:0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.wide{grid-column:1/-1}.point{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:19px;border:1px solid var(--line);border-radius:11px;background:#fbfcfe}.point strong{grid-column:1/-1;font-size:16px}
    label{display:grid;align-content:start;align-self:start;grid-auto-rows:max-content;gap:8px;font-size:15px;font-weight:650;color:#203350}input,select{width:100%;height:52px;border:1px solid #cbd5e1;border-radius:10px;padding:0 14px;font:400 16px inherit;background:#fff;color:#071831}input::placeholder{color:#8b97a9}input:focus,select:focus{outline:3px solid #285ea815;border-color:#6389bc}.hint{font-size:13px;font-weight:400;line-height:1.65;color:var(--muted)}code{font-family:ui-monospace,Consolas,monospace;color:#304c70}
    .actions{display:flex;align-items:center;gap:13px;margin-top:9px}button{border:0;border-radius:9px;padding:12px 20px;font:650 14px inherit;cursor:pointer;background:#173c6a;color:#fff}button:hover{background:var(--blue2)}button.danger{background:#fff0f1;color:var(--red);border:1px solid #f1cdd1;padding:8px 13px}button:disabled{opacity:.55;cursor:not-allowed}.check{display:flex;align-items:center;gap:10px;min-height:30px}.check input{width:18px;height:18px;accent-color:#173c6a}.check span{font-weight:650}.hidden{display:none!important}
    .offset{padding:13px 15px;border:1px solid #d7e3f2;border-radius:9px;background:var(--pale);color:#214e88;font-variant-numeric:tabular-nums;font-size:14px}.task{padding:20px 0;border-top:1px solid #e2e7ee}.task:first-child{border-top:0;padding-top:0}.task:last-child{padding-bottom:0}.task-head{display:flex;justify-content:space-between;gap:12px}.status{font-size:17px;font-weight:750}.meta{font-size:13px;line-height:1.6;color:var(--muted);margin-top:7px;overflow-wrap:anywhere}.bar{height:12px;background:#e9eef3;border-radius:99px;margin:15px 0;overflow:hidden}.bar i{display:block;height:100%;background:#356da9;transition:width .3s}.error{color:var(--red);white-space:pre-wrap;margin-top:8px}.empty{color:var(--muted);padding:6px 0 12px}.summary{padding:27px 30px}.summary-label{color:var(--muted);font-size:17px}.summary-value{font-size:31px;font-weight:800;margin-top:7px}.summary-sub{color:var(--muted);margin-top:7px}.summary-stats{display:flex;gap:28px;margin-top:20px;color:#465a78}.summary-stats b{color:#0b1b34;font-size:18px}.right{position:sticky;top:24px}
    @media(max-width:1050px){main{grid-template-columns:1fr;max-width:760px}.right{position:static}}
    @media(max-width:650px){header span{display:none}main{padding:15px}.grid,.point{grid-template-columns:1fr}.wide,.point strong{grid-column:1}.card-body,.summary{padding:20px}.card-title{padding:18px 20px}.summary-stats{gap:15px;flex-wrap:wrap}}
  </style>
</head>
<body><header><div class="mark">S</div><strong>SHP 整体偏移</strong><span>基于控制点的批量几何平移工具</span></header><main>
  <section class="card"><div class="card-body"><form id="form" class="grid"><h2 class="wide">路径与坐标</h2>
    <label class="wide">输入 SHP 路径<input name="input_path" required value="" placeholder="\\10.10.10.11\data\目录\source.shp 或 /mnt/nas_data/目录/source.shp"></label>
    <label class="check wide"><input id="overwrite" name="overwrite" type="checkbox"><span>覆盖原始 SHP</span></label>
    <label id="output-directory-row" class="wide">输出文件夹<input id="output-directory" name="output_directory" required value="" placeholder="\\10.10.10.10\nas_data\输出目录（文件名自动与输入 SHP 相同）"></label>
    <div class="point"><strong>① 原始数据点</strong><label>X<input name="original_x" type="number" step="any" required></label><label>Y<input name="original_y" type="number" step="any" required></label></div>
    <div class="point"><strong>② 正确位置点</strong><label>X<input name="correct_x" type="number" step="any" required></label><label>Y<input name="correct_y" type="number" step="any" required></label></div>
    <div id="offset" class="offset wide">位移量：等待输入坐标</div>
    <h2 class="wide">并发与处理范围</h2>
    <label>并发数<input id="workers" name="workers" type="number" min="1" max="128" value="16" required></label>
    <label>每批要素数<input name="batch_size" type="number" min="1" max="100000" value="1000" required></label>
    <div class="actions wide"><button type="submit">开始偏移任务</button><span id="message"></span></div>
  </form></div></section>
  <div class="right"><section class="card"><div class="summary"><div id="summary-label" class="summary-label">等待开始</div><div id="summary-value" class="summary-value">第 0 / 0 个要素</div><div id="summary-sub" class="summary-sub">尚无任务</div><div class="bar"><i id="summary-bar" style="width:0%"></i></div><div class="summary-stats"><span>完成 <b id="stat-done">0</b></span><span>总数 <b id="stat-total">0</b></span><span>速度 <b id="stat-rate">0</b></span></div></div></section>
  <section class="card"><div class="card-title">偏移任务状态</div><div class="card-body" id="tasks"><div class="empty">尚无偏移任务</div></div></section></div>
</main><script>
const form=document.querySelector('#form'), tasksEl=document.querySelector('#tasks'), msg=document.querySelector('#message');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function offset(){const f=new FormData(form),raw=['original_x','original_y','correct_x','correct_y'].map(k=>f.get(k)),v=raw.map(Number);document.querySelector('#offset').textContent=raw.every(x=>x!=='')&&v.every(Number.isFinite)?`位移量：dx = ${(v[2]-v[0]).toFixed(6)}，dy = ${(v[3]-v[1]).toFixed(6)}`:'位移量：等待输入坐标'}
form.addEventListener('input',offset);
const overwrite=document.querySelector('#overwrite'),outputRow=document.querySelector('#output-directory-row'),outputDirectory=document.querySelector('#output-directory');
function toggleOutput(){outputRow.classList.toggle('hidden',overwrite.checked);outputDirectory.required=!overwrite.checked}
overwrite.addEventListener('change',toggleOutput);overwrite.checked=false;toggleOutput();
form.addEventListener('submit',async e=>{e.preventDefault();msg.textContent='正在提交…';const d=Object.fromEntries(new FormData(form));d.overwrite=overwrite.checked;for(const k of ['original_x','original_y','correct_x','correct_y'])d[k]=Number(d[k]);for(const k of ['workers','batch_size'])d[k]=parseInt(d[k],10);try{const r=await fetch('/api/tasks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}),j=await r.json();if(!r.ok)throw Error(j.error);msg.textContent=`任务 ${j.id} 已启动`;refresh()}catch(x){msg.textContent=x.message}});
function duration(x){if(x==null||!isFinite(x))return '—';x=Math.max(0,Math.round(x));return x<60?`${x} 秒`:x<3600?`${Math.floor(x/60)} 分 ${x%60} 秒`:`${Math.floor(x/3600)} 时 ${Math.floor(x%3600/60)} 分`}
function speed(t){return t.byte_rate?`${(t.byte_rate/1048576).toFixed(1)} MB/秒`:`${Number(t.rate||0).toFixed(0)} 要素/秒`}
const labels={queued:'排队中',running:'处理中',completed:'已完成',failed:'失败',cancelled:'已取消'};
async function cancel(id){await fetch(`/api/tasks/${id}/cancel`,{method:'POST'});refresh()}
async function refresh(){try{const r=await fetch('/api/tasks'),list=await r.json(),latest=list.at(-1);tasksEl.innerHTML=list.length?list.slice().reverse().map(t=>{const active=['queued','running'].includes(t.status),p=Math.min(100,Math.max(0,t.percent||0));return `<article class="task"><div class="task-head"><span class="status">${esc(labels[t.status]||t.status)} · ${esc(t.stage||'等待')} · ${p.toFixed(2)}%</span>${active?`<button class="danger" onclick="cancel('${t.id}')">取消</button>`:''}</div><div class="meta">${esc(t.params.input_path)} → ${esc(t.params.output_path)}</div><div class="bar"><i style="width:${p}%"></i></div><div class="meta">${Number(t.processed||0).toLocaleString()} / ${Number(t.total||0).toLocaleString()} 要素　速度 ${speed(t)}　剩余 ${duration(t.eta_seconds)}　dx=${esc(t.dx??'—')}，dy=${esc(t.dy??'—')}</div>${t.error?`<div class="error">${esc(t.error)}</div>`:''}</article>`}).join(''):'<div class="empty">尚无偏移任务</div>';document.querySelector('#summary-label').textContent=latest?`${labels[latest.status]||latest.status} · ${latest.stage||'等待'}`:'等待开始';document.querySelector('#summary-value').textContent=`第 ${Number(latest?.processed||0).toLocaleString()} / ${Number(latest?.total||0).toLocaleString()} 个要素`;document.querySelector('#summary-sub').textContent=latest?`任务 ${latest.id} · 剩余 ${duration(latest.eta_seconds)}`:'尚无任务';document.querySelector('#summary-bar').style.width=`${Math.min(100,Math.max(0,latest?.percent||0))}%`;document.querySelector('#stat-done').textContent=Number(latest?.processed||0).toLocaleString();document.querySelector('#stat-total').textContent=Number(latest?.total||0).toLocaleString();document.querySelector('#stat-rate').textContent=latest?speed(latest):'0'}catch(e){tasksEl.innerHTML=`<div class="error">无法获取任务：${esc(e.message)}</div>`}}
refresh();setInterval(refresh,1500);
</script></body></html>
